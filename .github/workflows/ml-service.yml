name: ml-service CI

on:
  push:
    paths:
      - "ml-service/**"
      - "contracts/ml-service-contract.yaml"
  pull_request:
    paths:
      - "ml-service/**"
      - "contracts/ml-service-contract.yaml"

jobs:
  ml-service-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
