name: backend-service CI

on:
  push:
    paths:
      - "backend-service/**"
      - "contracts/backend-service-contract.yaml"
  pull_request:
    paths:
      - "backend-service/**"
      - "contracts/backend-service-contract.yaml"

jobs:
  backend-service-build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?schema=public
    defaults:
      run:
        working-directory: backend-service
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend-service/package-lock.json
      - run: npm ci
      - run: npx prisma db push
      - run: npm test
        env:
          JWT_SECRET: "ci_jwt_secret"
