name: backend-service CI

on:
  push:
    branches:
      - feat/yash-ai-catalogue
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  backend-service-build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?schema=public
      JWT_SECRET: ci_test_secret
      B2_KEY_ID: ci_test_key_id
      B2_APPLICATION_KEY: ci_test_application_key
      B2_BUCKET_NAME: sihartisanmedia
      B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_REGION: us-east-005
      B2_SIGNED_URL_EXPIRES_SECONDS: 3600
    defaults:
      run:
        working-directory: backend-service
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend-service/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma client
        run: npx prisma generate
        
      - name: Push Prisma schema
        run: npx prisma db push
        
      - name: Run test suite
        run: npm test
