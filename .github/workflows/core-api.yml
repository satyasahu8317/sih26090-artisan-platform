name: core-api CI

on:
  push:
    paths:
      - "core-api/**"
      - "contracts/springboot-api-contract.yaml"
  pull_request:
    paths:
      - "core-api/**"
      - "contracts/springboot-api-contract.yaml"

jobs:
  core-api-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - run: ./mvnw -B verify
