openapi: 3.0.3
info:
  title: SIH26090 - Realtime & Messaging Service (Node.js)
  description: >
    Owned by the Node.js Developer. This service is intentionally thin and
    stateless - it owns NO core business data (no artisans, no listings, no
    orders). Its only jobs are: (1) relay WhatsApp media into the Spring
    Boot pipeline, (2) push notifications/realtime events out to users, and
    (3) optionally relay ONDC webhook traffic (stretch goal). All business
    logic and persistence lives in Spring Boot - don't duplicate it here.

    Two of these paths are NOT called by Flutter/buyers directly - they are
    invoked by Meta's WhatsApp Cloud API and by Spring Boot itself:
      - POST /whatsapp/webhook      <- called by Meta (incoming artisan messages)
      - POST /notifications/dispatch <- called by Spring Boot (outgoing notifications)
  version: "0.1.0"

servers:
  - url: https://realtime.sih26090.local/v1
    description: Local/dev placeholder - replace with actual deployed URL

tags:
  - name: WhatsApp
  - name: Notifications
  - name: Realtime
  - name: ONDC
    description: Stretch goal - webhook adapter, build only if time permits
  - name: Health

paths:
  # ------------------------------------------------------------------
  # HEALTH
  # ------------------------------------------------------------------
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  # ------------------------------------------------------------------
  # WHATSAPP
  # ------------------------------------------------------------------
  /whatsapp/webhook:
    get:
      tags: [WhatsApp]
      summary: >
        Webhook verification handshake required by Meta when first
        registering the callback URL in the WhatsApp Business dashboard.
      parameters:
        - name: hub.mode
          in: query
          schema:
            type: string
        - name: hub.verify_token
          in: query
          schema:
            type: string
        - name: hub.challenge
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Echoes back hub.challenge if the verify token matches
          content:
            text/plain:
              schema:
                type: string

    post:
      tags: [WhatsApp]
      summary: >
        Receives incoming WhatsApp messages from Meta (photo + voice note
        from an artisan). This is a THIN RELAY: extract the media, download
        it from Meta's temporary media URL, re-upload it via Spring Boot's
        /uploads/init flow, then call Spring Boot's
        /internal/ingestion/whatsapp endpoint to create the draft listing.
        Do not implement business logic here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppInboundPayload"
      responses:
        "200":
          description: >
            Acknowledged. Must respond quickly (Meta expects a fast 200) -
            do heavy work (download/upload/relay) asynchronously after
            responding.

  /whatsapp/send:
    post:
      tags: [WhatsApp]
      summary: >
        Send an outbound WhatsApp message to an artisan - typically called
        internally after Spring Boot's ML callback marks a listing READY
        ("Your listing is ready - reply REVIEW to see it").
      security: [{ internalApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppSendRequest"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId:
                    type: string

  # ------------------------------------------------------------------
  # NOTIFICATIONS
  # ------------------------------------------------------------------
  /notifications/dispatch:
    post:
      tags: [Notifications]
      summary: >
        Called by Spring Boot whenever a user-facing event happens (listing
        READY, order CONFIRMED/SHIPPED, etc). This service decides the best
        channel (push notification vs WhatsApp vs in-app realtime event)
        and fires it - Spring Boot doesn't need to know which channel was
        used.
      security: [{ internalApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDispatchRequest"
      responses:
        "202":
          description: Notification accepted for delivery

  /notifications/register-device:
    post:
      tags: [Notifications]
      summary: >
        Flutter calls this once at login/app-start to register the device's
        FCM token so push notifications can reach it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, fcmToken, platform]
              properties:
                userId:
                  type: string
                  format: uuid
                fcmToken:
                  type: string
                platform:
                  type: string
                  enum: [ANDROID, IOS]
      responses:
        "200":
          description: Device registered

  # ------------------------------------------------------------------
  # REALTIME (Socket.IO - documented here for reference, not pure REST)
  # ------------------------------------------------------------------
  /realtime/chat/{orderId}/messages:
    get:
      tags: [Realtime]
      summary: >
        Fetch chat history for a buyer-artisan conversation tied to an
        order (if time permits building chat). Live messages during an
        active session are pushed over a Socket.IO channel named
        "order:{orderId}", not via this REST endpoint - this endpoint is
        for loading history on (re)connect.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"

    post:
      tags: [Realtime]
      summary: Send a chat message (also broadcast live over Socket.IO to the other participant)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  # ------------------------------------------------------------------
  # ONDC (stretch goal)
  # ------------------------------------------------------------------
  /ondc/webhook:
    post:
      tags: [ONDC]
      summary: >
        STRETCH GOAL - receives ONDC network callbacks (e.g. on_search,
        on_confirm) and translates them into Spring Boot order/catalog
        updates. Build only after WhatsApp + core flow are solid. A mocked
        version that just logs and acknowledges is acceptable for the demo
        if full ONDC integration isn't feasible in the time available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Shape follows the ONDC Beckn protocol action being received (context + message)
              additionalProperties: true
      responses:
        "200":
          description: Acknowledged (ONDC "ACK" pattern)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: Same shared secret used between Spring Boot and Python - keeps internal calls off the public surface

  schemas:
    WhatsAppInboundPayload:
      type: object
      description: >
        Simplified shape - Meta's actual webhook payload is deeply nested
        (entry[].changes[].value.messages[]). Parse down to this shape in
        your handler before relaying.
      properties:
        fromPhoneNumber:
          type: string
          example: "+919812345678"
        messageType:
          type: string
          enum: [image, audio, text]
        mediaId:
          type: string
          description: Meta's temporary media ID - must be resolved to a download URL via the Graph API before it expires
          nullable: true
        text:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time

    WhatsAppSendRequest:
      type: object
      required: [toPhoneNumber, templateOrText]
      properties:
        toPhoneNumber:
          type: string
        templateOrText:
          type: string
          example: "Your listing for {productName} is ready! Reply REVIEW to see it."
        mediaUrl:
          type: string
          format: uri
          nullable: true
          description: Optional image to attach (e.g. the enhanced product photo)

    NotificationDispatchRequest:
      type: object
      required: [userId, eventType]
      properties:
        userId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - LISTING_READY
            - LISTING_FAILED
            - ORDER_PLACED
            - ORDER_CONFIRMED
            - ORDER_SHIPPED
            - ORDER_DELIVERED
        preferredChannel:
          type: string
          enum: [PUSH, WHATSAPP, AUTO]
          default: AUTO
          description: AUTO lets this service pick push vs WhatsApp based on what the user has available/registered
        payload:
          type: object
          additionalProperties: true
          description: Event-specific data used to fill notification templates (e.g. listingId, productName, orderId)

    ChatMessage:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        text:
          type: string
        sentAt:
          type: string
          format: date-time
